[project]
name = "bolt-python-examples-standardized-auth"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
    "slack_bolt==1.30.0",
    "slack_cli_hooks==0.3.0",
    "slack_sdk==3.46.0",
]

[project.optional-dependencies]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.3",
]

[tool.setuptools.packages.find]
include = ["src*"]
