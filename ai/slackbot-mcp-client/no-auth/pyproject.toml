[project]
name = "bolt-python-examples-mcp-client-no-auth"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
    "httpx2==2.16.0",
    "mcp==2.3.0",
    "slack_bolt==1.30.0",
    "slack_cli_hooks==0.3.0",
    "slack_sdk==3.46.0",
    "starlette==1.9.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.setuptools.packages.find]
include = ["src*"]
