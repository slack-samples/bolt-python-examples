name: Test
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    name: "pytest@python3.14"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        showcase:
          - "block-kit"
          - "ai/slackbot-mcp-client/no-auth"
          - "ai/slackbot-mcp-client/slack-identity"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Run tests
        run: |
          cd "${{ matrix.showcase }}"
          pip install -r requirements.txt
          ruff check
          ruff format --diff --check
          if pip show mypy > /dev/null 2>&1; then mypy ./**/*.py; fi
          pytest -v
