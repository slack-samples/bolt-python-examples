name: Test
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    name: "pytest@python3.14"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        showcase:
          - "ai/slackbot-mcp-client/no-auth"
          - "ai/slackbot-mcp-client/rich-responses/mcp-apps"
          - "ai/slackbot-mcp-client/slack-identity"
          - "block-kit"
          - "methods"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Run tests
        run: |
          cd "${{ matrix.showcase }}"
          pip install -r requirements.txt
          ruff check
          ruff format --diff --check
          mypy ./**/*.py
          # Exit code 5 = "no tests collected" (e.g. type-check-only showcases); treat as success.
          pytest -v || [ $? -eq 5 ]
