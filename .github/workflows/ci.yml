name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        showcase:
          - "ai/slackbot-mcp-client/no-auth"
          - "ai/slackbot-mcp-client/rich-responses/mcp-apps"
          - "ai/slackbot-mcp-client/slack-identity"
          - "block-kit"
          - "methods"
          - "standardized-auth"
    defaults:
      run:
        working-directory: ${{ matrix.showcase }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -r requirements.txt
      - name: Lint and check formatting
        run: |
          ruff check .
          ruff format --diff --check .
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        showcase:
          - "ai/slackbot-mcp-client/no-auth"
          - "ai/slackbot-mcp-client/rich-responses/mcp-apps"
          - "ai/slackbot-mcp-client/slack-identity"
          - "block-kit"
          - "methods"
          - "standardized-auth"
    defaults:
      run:
        working-directory: ${{ matrix.showcase }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -r requirements.txt
      - name: Type check
        run: |
          mypy .
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        showcase:
          - "ai/slackbot-mcp-client/no-auth"
          - "ai/slackbot-mcp-client/rich-responses/mcp-apps"
          - "ai/slackbot-mcp-client/slack-identity"
          - "block-kit"
          - "standardized-auth"
    defaults:
      run:
        working-directory: ${{ matrix.showcase }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -r requirements.txt
      - name: Run all tests
        run: |
          pytest -v
