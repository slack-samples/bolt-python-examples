name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        showcase:
          - "ai/slackbot-mcp-client/no-auth"
          - "ai/slackbot-mcp-client/rich-responses/mcp-apps"
          - "ai/slackbot-mcp-client/slack-identity"
          - "block-kit"
          - "methods"
          - "standardized-auth"
    defaults:
      run:
        working-directory: ${{ matrix.showcase }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -e ".[dev]"
      - name: Lint and check formatting
        run: |
          ruff check .
          ruff format --diff --check .
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        showcase:
          - "ai/slackbot-mcp-client/no-auth"
          - "ai/slackbot-mcp-client/rich-responses/mcp-apps"
          - "ai/slackbot-mcp-client/slack-identity"
          - "block-kit"
          - "methods"
          - "standardized-auth"
    defaults:
      run:
        working-directory: ${{ matrix.showcase }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -e ".[dev]"
      - name: Type check
        run: |
          mypy .
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        showcase:
          - "ai/slackbot-mcp-client/no-auth"
          - "ai/slackbot-mcp-client/rich-responses/mcp-apps"
          - "ai/slackbot-mcp-client/slack-identity"
          - "block-kit"
          - "standardized-auth"
    defaults:
      run:
        working-directory: ${{ matrix.showcase }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -e ".[dev]"
      - name: Run all tests
        run: |
          pytest -v
